services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen_pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen_pilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || true"]
      interval: 10s
      timeout: 5s
      retries: 3

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_API_BASE=http://ollama:11434

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://kitchen:kitchen@postgres:5432/kitchen_pilot
      - LITELLM_BASE_URL=http://litellm:4000
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=ollama_chat/qwen3:8b
      - FALLBACK_MODELS=["ollama_chat/gemma3:latest"]
      - CORS_ORIGINS=["http://localhost:3000"]
      - GCAL_MCP_URL=http://gcal-mcp:3100
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started

  gcal-mcp:
    image: node:20-slim
    working_dir: /app
    command: >
      sh -c "npm install -g @anthropic-ai/supergateway @nspady/google-calendar-mcp &&
             supergateway --port 3100 --
             google-calendar-mcp"
    ports:
      - "3100:3100"
    environment:
      - GOOGLE_OAUTH_CREDENTIALS=/app/credentials/gcp-oauth.keys.json
    volumes:
      - ./credentials:/app/credentials:ro
      - gcal_mcp_data:/app/.google-calendar-mcp
    profiles:
      - calendar

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
  gcal_mcp_data:
